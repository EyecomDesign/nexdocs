name: Deploy smoke test

on:
  push:
    branches: [main, staging]

jobs:
  smoke-test:
    name: Health check
    runs-on: ubuntu-latest
    # Only run if Railway deploy URL is set as a secret
    if: ${{ vars.DEPLOY_URL != '' }}
    steps:
      - name: Wait for Railway deploy
        run: sleep 30

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.DEPLOY_URL }}/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"
